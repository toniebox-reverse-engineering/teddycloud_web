name: CI

on:
    pull_request:
    push:
        branches:
            - master
            - develop

jobs:
    prettier:
        name: Formatting Check
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci
            - run: npm run format:check

    build:
        name: Production Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci
            - run: npm run build
